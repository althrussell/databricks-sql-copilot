bundle:
  name: sql-observability-genie

include:
  - resources/*.yml

# Runtime settings (AUTH_MODE, ENABLE_LAKEBASE, AI_MODEL_*, GENIE_SPACE_ID) come from
# app.yaml in the source code; scripts/deploy.sh generates a per-deployment copy.
variables:
  warehouse_id:
    description: >-
      SQL warehouse bound to the app as the sql-warehouse resource. Required:
      pass --var warehouse_id=<id> or set BUNDLE_VAR_warehouse_id.

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: DEFAULT

  prod:
    mode: production
    workspace:
      profile: DEFAULT
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
